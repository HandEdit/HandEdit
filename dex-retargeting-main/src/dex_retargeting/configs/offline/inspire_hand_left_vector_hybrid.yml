retargeting:
  type: vector
  urdf_path: inspire_hand/inspire_hand_left.urdf
  target_joint_names: [pinky_proximal_joint, ring_proximal_joint, middle_proximal_joint, index_proximal_joint,
    thumb_proximal_pitch_joint, thumb_proximal_yaw_joint]
  target_origin_link_names: [base, base, base, base, base, thumb_intermediate, index_intermediate, middle_intermediate,
    ring_intermediate, pinky_intermediate]
  target_task_link_names: [thumb_tip, index_tip, middle_tip, ring_tip, pinky_tip, thumb_tip, index_tip,
    middle_tip, ring_tip, pinky_tip]
  target_link_human_indices:
  - [0, 0, 0, 0, 0, 2, 6, 10, 14, 18]
  - [4, 8, 12, 16, 20, 4, 8, 12, 16, 20]
  add_dummy_free_joint: true
  scaling_factor: 1.15
  low_pass_alpha: 0.2
  ignore_mimic_joint: false
